apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: codeguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: codeguard/backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: codeguard-config
            - secretRef:
                name: codeguard-secrets
          resources:
            limits:
              cpu: "1500m"
              memory: "1.5Gi"
            requests:
              cpu: "300m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: codeguard
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
