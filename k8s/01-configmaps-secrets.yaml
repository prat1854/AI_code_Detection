apiVersion: v1
kind: ConfigMap
metadata:
  name: codeguard-config
  namespace: codeguard
data:
  NODE_ENV: "production"
  PORT: "5000"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "200"
  AI_SERVICE_URL: "http://ai-service:8000"
  REDIS_URL: "redis://redis:6379"
  AI_PROVIDER: "heuristic"
  AI_SERVICE_HOST: "0.0.0.0"
  AI_SERVICE_PORT: "8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: codeguard-secrets
  namespace: codeguard
type: Opaque
stringData:
  POSTGRES_USER: "codeguard"
  POSTGRES_PASSWORD: "codeguard_k8s_secret_password_2026"
  POSTGRES_DB: "codeguard_db"
  DATABASE_URL: "postgresql://codeguard:codeguard_k8s_secret_password_2026@postgres:5432/codeguard_db"
  JWT_SECRET: "codeguard-super-secure-production-k8s-jwt-key-2026"
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
