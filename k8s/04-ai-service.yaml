apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: codeguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: codeguard/ai-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: codeguard-config
            - secretRef:
                name: codeguard-secrets
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: codeguard
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000
